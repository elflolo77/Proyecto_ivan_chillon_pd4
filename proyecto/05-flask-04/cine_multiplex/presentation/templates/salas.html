{% extends "base.html" %}

{% block titulo %}Salas - Cine Flolix{% endblock %}

{% block contenido %}
<h2>Salas</h2>
<p><a href="{{ url_for('crear_sala') }}">Crear sala</a></p>
{% if salas %}
<ul>
    {% for sala in salas %}
    <li>{{ sala.descripcion }}</li>
    {% endfor %}
</ul>
{% else %}
<p>No hay salas.</p>
{% endif %}
{% endblock %}
