{% extends "base.html" %}

{% block titulo %}Anular entrada - Cine Flolix{% endblock %}

{% block contenido %}
<h2>Anular entrada</h2>
{% if error %}
<p><strong>Error:</strong> {{ error }}</p>
{% endif %}
<form method="post">
    <p>
        <label>ID de entrada
            <input type="text" name="identificador_entrada" value="{{ datos.identificador_entrada|default('') }}" required>
        </label>
    </p>
    <button type="submit">Buscar entrada</button>
</form>
{% endblock %}
